# ===================================================================
# TOURTEC INDIA - Spring Boot PostgreSQL Application Configuration
# ===================================================================

# Server Port matching React Frontend Proxy
server.port=5000

# Application Name
spring.application.name=tourtec-backend

# ===================================================================
# PostgreSQL Database Configuration
# Username: postgres | Password: root | Port: 5433 (PostgreSQL 18)
# ===================================================================
spring.datasource.url=jdbc:postgresql://localhost:5433/tourtec_db
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================================
# Spring Data JPA & Hibernate Configuration
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JSON Pretty Print
spring.jackson.serialization.indent-output=true

# Logging
logging.level.com.tourtec=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO
