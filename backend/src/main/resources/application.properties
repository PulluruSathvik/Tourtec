# ===================================================================
# TOURTEC INDIA - Spring Boot Configuration (STS Tool Backend)
# ===================================================================
server.port=${PORT:5000}
spring.application.name=tourtec-backend

# PostgreSQL Database Connection (Local: Port 5433 | Cloud: DATABASE_URL)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:tourtec_db}}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# CORS & Gateway
cors.allowed-origins=*
