services:
  # 1. Backend Express API Server
  - type: web
    name: tourtec-backend
    env: node
    plan: free
    buildCommand: npm --prefix backend install
    startCommand: npm --prefix backend start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: tourtec-db
          property: connectionString
      - key: FAST2SMS_API_KEY
        value: BkOTeFDtAryJq5IwLzdXYGCW1EbMhZsfQuS64VljP20ogx7icvv4ZQmWMqBe3KUCGfFSTPyrYJlVd19t

  # 2. Frontend React / Vite Web App
  - type: web
    name: tourtec-frontend
    env: static
    buildCommand: npm --prefix frontend install && npm --prefix frontend run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: tourtec-backend
          property: host
      - key: VITE_GOOGLE_CLIENT_ID
        value: 849997510284-lb00lknh9vfbhrhj2pfhmkiqr9qcdgei.apps.googleusercontent.com

databases:
  # 3. PostgreSQL Managed Database
  - name: tourtec-db
    databaseName: tourtec_db
    user: tourtec_user
    plan: free
